<!doctype html>
<!-- Brand palette as rows of swatches, no labels. Params: rows (array of arrays of hex colors). Use transparent + bare. -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; height: 100%; background: transparent; }
  body { display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 0 24px; box-sizing: border-box; }
  .row { display: flex; gap: 10px; }
  .row i { flex: 1; aspect-ratio: 1; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(127,127,127,.18); }
</style></head>
<body>
  <script>
    const P = {{json}};
    for (const row of P.rows) document.body.insertAdjacentHTML("beforeend",
      `<div class="row">${row.map((c) => `<i style="background:${c}"></i>`).join("")}${"<i style='visibility:hidden'></i>".repeat(Math.max(0, P.columns - row.length))}</div>`);
  </script>
</body></html>
