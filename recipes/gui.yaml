project: gui
defaults:
  ratio: "4:3"
  themes: [dark, light]
  web:
    url: https://usegui.com
    scheme: match # usegui.com has real dark + light modes
    viewport: 1280x800 # smaller viewport → UI renders larger in frame

shots:
  # Gui itself: usegui.com open in Gui, "real app" picked, the change written in the chat.
  # Captured by `bun scripts/gui-states.ts` (drives the real app on a throwaway project copy).
  - id: app
    source: { type: file, path: "raw/gui/app-compose-{theme}.png", window: true }
    layout: single
    options: { fill: 0.84 }

  # Gui up close, running off the right and bottom edges (4:3 and square).
  - id: app-corner
    source: { type: file, path: "raw/gui/app-pick-{theme}.png", window: true, density: 4 }
    layout: bleed
    options: { edge: corner, zoom: 1.35, insetX: 0.1, insetY: 0.12 }

  - id: app-corner-square
    source: { type: file, path: "raw/gui/app-pick-{theme}.png", window: true, density: 4 }
    layout: bleed
    ratio: "1:1"
    options: { edge: corner, zoom: 1.35, insetX: 0.12, insetY: 0.12 }

  # Homepage hero, crossed: light UI on near-black, dark UI on off-white.
  - id: home-cross
    source: { type: web, scheme: cross }
    layout: single

  # The whole page running off the bottom edge.
  - id: home-bleed
    source: { type: web, fullPage: true }
    layout: bleed
    options: { edge: bottom, size: 0.8, inset: 0.1 }

  # "Bring your own agent" on desktop + mobile.
  - id: site-duo
    sources:
      - { type: web, scrollTo: "section:nth-of-type(3)" }
      - { type: web, viewport: 390x844, scrollTo: "section:nth-of-type(3)" }
    layout: duo

  # MacBook ("How it works") + iPhone (agents panel): different content on each device.
  - id: devices
    sources:
      - { type: web, frame: macbook, scrollTo: "section.wide" }
      - { type: web, frame: iphone, scrollTo: "figure.narrow" }
    layout: duo
    options: { scale: 0.72, overlap: 0.06, dropB: 0.04 }

  # Studio Display on the "Your real app" section.
  - id: display
    source: { type: web, frame: display, scrollTo: "section:nth-of-type(4)" }
    layout: single

  # iPad Pro (portrait) on "How it works".
  - id: ipad
    source: { type: web, frame: ipad, scrollTo: "section.wide" }
    layout: single

  # Four phones, four different screens.
  - id: mobile-stagger
    sources:
      - { type: web, frame: iphone }
      - { type: web, frame: iphone, scrollTo: "section.wide" }
      - { type: web, frame: iphone, scrollTo: "figure.narrow" }
      - { type: web, frame: iphone, scrollTo: "section:nth-of-type(4)" }
    layout: stagger
    options: { size: 0.6, offset: 0.05, gap: 0.024 }

  # Short, slow scroll from the hero into "How it works".
  - id: home-scroll
    source: { type: web }
    layout: single
    motion: { kind: scroll, duration: 4.5, to: "section.wide", hold: 1 }

  # Mobile scroll through "How it works" down to the agents panel.
  - id: mobile-scroll
    source: { type: web, frame: iphone, scrollTo: "section.wide" }
    layout: single
    motion: { kind: scroll, duration: 6, from: "section.wide", to: "figure.narrow", hold: 1 }
